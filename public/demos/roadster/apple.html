<title>Tesla Roadster</title>
<style>
:root {

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
#viewport { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
.slide { position: absolute; inset: 0; padding: 64px 96px 92px; display: flex; flex-direction: column; visibility: hidden; opacity: 0; }
.slide.on { visibility: visible; opacity: 1; }
.head { flex: none; max-width: 1240px; }
.fig { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 28px; }
.fig canvas { flex: 1; min-height: 0; width: 100%; display: block; }
.ctrl { flex: none; display: flex; align-items: center; gap: 28px; margin-top: 18px; min-height: 52px; }
.ctrl label { display: flex; align-items: center; gap: 16px; font-size: 20px; }
.ctrl input[type=range] { width: 420px; height: 44px; cursor: pointer; }
.ctrl output { font-family: var(--mono); font-size: 22px; min-width: 110px; }
.state { font-size: 22px; font-weight: 600; }
.note { font-size: 18px; line-height: 1.5; margin-top: 10px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 18px; font-size: 24px; line-height: 1.5; }
button, .btn { font: inherit; cursor: pointer; }
.replay { font-size: 20px; padding: 10px 22px; min-height: 44px; }
#foot { position: absolute; left: 96px; bottom: 36px; font-size: 18px; }
#dots { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; }
#dots button { width: 44px; height: 44px; background: none; border: 0; display: grid; place-items: center; }
#dots button span { display: block; width: 12px; height: 12px; }
#top { position: absolute; right: 96px; top: 28px; display: flex; gap: 16px; align-items: center; font-size: 17px; z-index: 5; }
.seg { display: flex; }
.seg a { padding: 6px 14px; text-decoration: none; min-height: 36px; display: grid; place-items: center; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .slide { transition: none !important; } }

body { background: #000; color: #F5F5F7; --focus: #2997FF; }
.slide { transition: opacity .35s cubic-bezier(.2,.8,.2,1); }
.kicker { font-size: 22px; color: #A1A1A6; font-weight: 500; margin-bottom: 18px; }
h1 { word-break: auto-phrase; font-size: 64px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; }
.cover h1 { font-size: 84px; max-width: 1360px; }
.lead { font-size: 26px; line-height: 1.5; color: #A1A1A6; margin-top: 18px; max-width: 1100px; }
.note { color: #86868B; }
.hint { color: #86868B; }
.replay { background: #1C1C1E; color: #F5F5F7; border: 0; border-radius: 999px; transition: background .2s; }
.replay:hover { background: #2C2C2E; }
.ctrl label { color: #A1A1A6; }
.ctrl output { color: #F5F5F7; }
.thrust-range { accent-color: #FF9F0A; } .press-range { accent-color: #2997FF; }
.state { color: #86868B; } .state[data-ok="1"] { color: #F5F5F7; }
.cols p { color: #A1A1A6; }
#foot { color: #86868B; }
#dots button span { border-radius: 50%; background: #48484A; transition: background .2s; }
#dots button[aria-current] span { background: #F5F5F7; }
.seg { background: #1C1C1E; border-radius: 999px; padding: 3px; }
.seg a { color: #A1A1A6; border-radius: 999px; transition: background .2s, color .2s; }
.seg a[aria-current] { background: #3A3A3C; color: #F5F5F7; }
#other { color: #2997FF; text-decoration: none; }
#other:hover, #back:hover { text-decoration: underline; }
#back { color: #2997FF; text-decoration: none; }

    c.beginPath(); c.moveTo(x2 + dx, y2 + dy);
    c.lineTo(x2 - ux * hs - uy * hs * 0.6 + dx, y2 - uy * hs + ux * hs * 0.6 + dy);
    c.lineTo(x2 - ux * hs + uy * hs * 0.6 + dx, y2 - uy * hs - ux * hs * 0.6 + dy); c.closePath(); c.fill();
  };
  if (TH.brut && color !== TH.ink) { draw(3, 3, TH.ink); }
  draw(0, 0, color);
}

function ground(c, y, W) {
  c.fillStyle = TH.groundFill; c.fillRect(0, y, W, 2000);
  c.strokeStyle = TH.groundLine; c.lineWidth = TH.brut ? 4 : 2;
  c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
}

function jets(c, x, y, len, dir, alpha) {
  // gas puffs from (x,y) along dir (unit vec), deterministic shimmer
  if (len < 2 || alpha <= 0) return;
  c.save(); c.globalAlpha = alpha;
  c.fillStyle = TH.thrust;
  c.beginPath();
  const [dx, dy] = dir, px = -dy, py = dx;
  c.moveTo(x + px * 10, y + py * 10);
  c.lineTo(x + dx * len + px * (10 + len * 0.12), y + dy * len + py * (10 + len * 0.12));
  c.lineTo(x + dx * len - px * (10 + len * 0.12), y + dy * len - py * (10 + len * 0.12));
  c.lineTo(x - px * 10, y - py * 10); c.closePath();
  c.globalAlpha = alpha * (TH.brut ? 1 : 0.85); c.fill();
  if (TH.brut) { c.globalAlpha = alpha; c.lineWidth = 3; c.strokeStyle = TH.ink; c.stroke(); }
  c.restore();
}

/* ---------- pages ---------- */
const WEIGHT = 16.7, AREA = 5;
const DRAW = {
  cover(c, t, W, H) {
    ground(c, 320, W);
    car(c, W * 0.6, 320, 2.1);
    jets(c, W * 0.6 - 150 * 2.1, 320 - 42 * 2.1, 260, [-1, 0], 1);
  },
  jet(c, t, W, H) {
    const G = 360, s = 1.35, xAt = (tt) => 470 + 34 * Math.pow(clamp(tt - 0.5, 0, 4), 2);
    ground(c, G, W);
    const x = xAt(t), rearOff = 150 * s, ny = G - 42 * s;
    for (let i = 0; i < 200; i++) {
      const ti = 0.5 + i * 0.022; if (ti > Math.min(t, 4.5)) break;
      const age = t - ti, a = 1 - age / 1.1; if (a <= 0) continue;
      const px = xAt(ti) - rearOff - age * 650 - rnd(i) * 40, py = ny + (rnd(i + 99) - 0.5) * (8 + age * 140);
      c.globalAlpha = a * (TH.brut ? 1 : 0.6); c.fillStyle = TH.thrust;
      c.beginPath(); c.arc(px, py, 5 + age * 14, 0, Math.PI * 2); c.fill();
      if (TH.brut) { c.lineWidth = 2; c.strokeStyle = TH.ink; c.stroke(); }
    }
    c.globalAlpha = 1;
    car(c, x, G, s);
    const k = clamp((t - 0.6) / 0.3, 0, 1);
    if (k > 0) {
      c.globalAlpha = k;
      arrow(c, x - 60, G - 175, x + 170, G - 175, TH.thrust); label(c, get("s2.thrust"), x + 190, G - 175, TH.thrust);
      const gx = x - rearOff - 20; arrow(c, gx, G - 175, gx - 150, G - 175, TH.thrust);
      label(c, get("s2.gas"), gx - 75, G - 125, TH.thrust, "center");
      c.globalAlpha = 1;
    }
  },
  lift(c, t, W, H, st) {
    const G = 390, v = st.v, s = 1.45;
    const lift = v > WEIGHT ? Math.min(170, 50 + (v - WEIGHT) * 7) : 0;
    st.shown = lerp(st.shown ?? lift, lift, REDUCED ? 1 : 0.12);
    const y = G - st.shown, x = 560;
    ground(c, G, W);
    for (const dx of [-40, 40]) jets(c, x + dx * s, y - 24 * s, 24 + v * 3.2, [0, 1], v > 0 ? 1 : 0);
    car(c, x, y, s);
    const mid = y - 60, ax = x + 290;
    const tl = Math.min(v * 5, mid - 30); arrow(c, ax, mid, ax, mid - tl, TH.thrust); label(c, `${get("s3.up")} ${v.toFixed(1)} kN`, ax + 26, mid - Math.max(20, tl - 12), TH.thrust);
    arrow(c, ax, mid, ax, mid + WEIGHT * 5, TH.grav); label(c, `${get("s3.down")} ${WEIGHT} kN`, ax + 26, mid + WEIGHT * 5 - 12, TH.grav);
  },
  tank(c, t, W, H) {
    const G = 400, s = 1.15, x = 520, burnEnd = 3.5;
    let h = 0, v = 0;
    for (let tt = 0; tt < t; tt += 1 / 120) {
      const firing = tt > 0.5 && tt < burnEnd;
      v += (firing ? 48 : -260) / 120; h += v / 120; if (h <= 0) { h = 0; v = Math.max(0, v); }
    }
    const level = clamp(1 - (t - 0.5) / (burnEnd - 0.5), 0, 1), firing = t > 0.5 && t < burnEnd;
    ground(c, G, W);
    const y = G - h;
    if (firing) for (const dx of [-40, 40]) jets(c, x + dx * s, y - 24 * s, 70 + 30 * level, [0, 1], 1);
    car(c, x, y, s);
    const mid = y - 55, ax = x + 240;
    if (firing) { arrow(c, ax, mid, ax, mid - 130, TH.thrust); label(c, get("s4.up"), ax + 24, mid - 116, TH.thrust); }
    arrow(c, ax, mid, ax, mid + 87, TH.grav); label(c, get("s4.down"), ax + 26, mid + 72, TH.grav);
    // tank gauge
    const gx = 1130, gy = 60, gw = 84, gh = 280;
    c.lineWidth = TH.brut ? 4 : 2; c.strokeStyle = TH.brut ? TH.ink : TH.muted;
    if (TH.brut) { c.fillStyle = TH.ink; c.fillRect(gx + 6, gy + 6, gw, gh); c.fillStyle = TH.paper; c.fillRect(gx, gy, gw, gh); }
    c.fillStyle = TH.thrust; c.fillRect(gx, gy + gh * (1 - level), gw, gh * level);
    c.strokeRect(gx, gy, gw, gh);
    label(c, get("s4.tank"), gx + gw / 2, gy + gh + 34, TH.ink, "center");
    c.font = FONT(600, 34); c.fillStyle = TH.ink; c.textBaseline = "middle"; c.textAlign = "left";
    c.fillText(`${Math.min(t, 6).toFixed(1)} ${get("s4.sec")}`, 40, 40);
  },
  suck(c, t, W, H) {
    const G = 360, s = 2.9, x = W / 2 - 40;
    const p = ease((t - 0.8) / 3);
    ground(c, G, W);
    const top = G - 24 * s, L = x - 146 * s, R = x + 148 * s;
    // under-car region
    c.fillStyle = TH.press; c.globalAlpha = TH.brut ? 0.18 + 0.1 * (1 - p) : 0.12 + 0.1 * (1 - p);
    c.fillRect(L, top, R - L, G - top); c.globalAlpha = 1;
    for (let i = 0; i < 70; i++) {
      const gone = rnd(i) < 0.75 * p; const fade = gone ? 0 : 1;
      if (!fade) continue;
      c.fillStyle = TH.press; c.beginPath();
      c.arc(lerp(L + 30, R - 30, rnd(i + 7)), lerp(top + 10, G - 10, rnd(i + 31)), 5, 0, Math.PI * 2); c.fill();
    }
    car(c, x, G, s);
    // skirts
    c.fillStyle = TH.ink; c.fillRect(L - 4, top - 4, 10, G - top + 4); c.fillRect(R - 6, top - 4, 10, G - top + 4);
    // fans
    for (const fx of [x - 30 * s, x + 30 * s]) {
      const fy = top + 4, ang = t * 10 * (t > 0.8 ? 1 : 0);
      c.save(); c.translate(fx, fy - 2);
      c.fillStyle = TH.paper; c.strokeStyle = TH.ink; c.lineWidth = 3;
      c.beginPath(); c.arc(0, 0, 26, 0, Math.PI * 2); c.fill(); c.stroke();
      c.rotate(ang); c.fillStyle = TH.ink;
      for (let b = 0; b < 3; b++) { c.rotate(Math.PI * 2 / 3); c.beginPath(); c.ellipse(12, 0, 12, 5, 0, 0, Math.PI * 2); c.fill(); }
      c.restore();
    }
    // atmosphere pushes on the roof (constant), pressure underneath shrinks
    for (const xl of [-110, -55, 0, 55, 110]) {
      const ax = x + xl * s, ay = G - roofAt(xl) * s - 8;
      arrow(c, ax, ay - 70, ax, ay, TH.press);
    }
    for (const xl of [-110, -20, 110]) {
      const ax = x + xl * s, len = 54 * (1 - 0.8 * p);
      arrow(c, ax, G - 4, ax, G - 4 - len, TH.press, TH.arrow * 0.7);
    }
    label(c, get("s5.outside"), x - 150 * s, 26, TH.press);
    label(c, get("s5.inside"), x - 146 * s, G + 40, TH.press);
    label(c, get("s5.fan"), x + 30 * s, G + 40, TH.ink, "center");
  },
  hang(c, t, W, H, st) {
    const CEIL = 96, s = 1.5, x = 520;
    const F = st.v * AREA, stick = F >= WEIGHT;
    st.drop = lerp(st.drop ?? 0, stick ? 0 : 1, REDUCED ? 1 : 0.1);
    // ceiling (top of the ramp)
    c.fillStyle = TH.groundFill; c.fillRect(0, 0, W, CEIL);
    c.strokeStyle = TH.groundLine; c.lineWidth = TH.brut ? 4 : 2; c.beginPath(); c.moveTo(0, CEIL); c.lineTo(W, CEIL); c.stroke();
    const y = CEIL + st.drop * 190, rot = Math.PI + st.drop * 0.18;
    car(c, x, y, s, rot);
    const ax = x + 320, P = CEIL + 200, fl = Math.min(P - CEIL - 12, F * 4.2);
    arrow(c, ax, P, ax, P - fl, TH.press);
    label(c, `${get("s6.force")} ${F.toFixed(1)} kN`, ax + 26, P - Math.max(20, fl - 12), TH.press);
    arrow(c, ax, P, ax, P + WEIGHT * 4.2, TH.grav);
    label(c, `${get("s6.down")} ${WEIGHT} kN`, ax + 26, P + WEIGHT * 4.2 - 12, TH.grav);
  },
  sum(c, t, W, H) {
    // left: jet car on the road
    ground(c, 300, W / 2 - 40);
    car(c, 360, 300, 1.15);
    jets(c, 360 - 150 * 1.15, 300 - 48, 150, [-1, 0], 1);
    arrow(c, 300, 130, 500, 130, TH.thrust); label(c, get("s7.up"), 520, 130, TH.thrust);
    // right: car hanging under the ceiling
    c.save(); c.translate(W / 2 + 40, 0);
    c.fillStyle = TH.groundFill; c.fillRect(0, 0, W / 2 - 40, 70);
    c.strokeStyle = TH.groundLine; c.lineWidth = TH.brut ? 4 : 2; c.beginPath(); c.moveTo(0, 70); c.lineTo(W / 2 - 40, 70); c.stroke();
    car(c, 300, 70, 1.15, Math.PI);
    for (const dx of [-80, 0, 80]) arrow(c, 300 + dx, 290, 300 + dx, 200, TH.press);
    label(c, get("s7.press"), 420, 260, TH.press);
    c.restore();
  }
};

/* ---------- canvas setup ---------- */
const slides = [...document.querySelectorAll(".slide")];
const canv = [...document.querySelectorAll("canvas")].map((el) => ({
  el, c: el.getContext("2d"), fn: DRAW[el.dataset.draw], W: +el.dataset.w, H: +el.dataset.h,
  dur: +(el.dataset.dur || 0), slide: slides.indexOf(el.closest(".slide")), st: {}, start: 0
}));
function sizeAll() {
  for (const o of canv) {
    const cw = o.el.clientWidth || 1408, ch = o.el.clientHeight || o.H;
    o.el.width = cw * DPR; o.el.height = ch * DPR;
    o.k = Math.min(cw / o.W, ch / o.H); o.ox = (cw - o.W * o.k) / 2; o.oy = (ch - o.H * o.k) / 2;
  }
}
function paint(o, t) {
  const c = o.c; c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = TH.canvasBg; c.fillRect(0, 0, o.el.width, o.el.height);
  c.setTransform(DPR * o.k, 0, 0, DPR * o.k, DPR * o.ox, DPR * o.oy);
  c.globalAlpha = 1; c.textAlign = "left";
  o.fn(c, t, o.W, o.H, o.st);
}

/* sliders */
function bindSlider(cls, slideIdx, fmt, test) {
  const inp = document.querySelector(cls), out = inp.nextElementSibling, state = inp.closest(".ctrl").querySelector(".state");
  const o = canv.find((x) => x.slide === slideIdx);
  const upd = () => {
    o.st.v = +inp.value; out.textContent = fmt(o.st.v);
    const ok = test(o.st.v); state.textContent = ok[0]; state.dataset.ok = ok[1];
  };
  inp.addEventListener("input", upd); upd();
}
bindSlider(".thrust-range", 2, (v) => `${v.toFixed(1)} kN`, (v) => v > WEIGHT ? [S.s3.on, 1] : [S.s3.off, 0]);
bindSlider(".press-range", 5, (v) => `${v.toFixed(1)} kPa`, (v) => v * AREA >= WEIGHT ? [S.s6.stick, 1] : [S.s6.fall, 0]);

/* ---------- navigation ---------- */
const dots = document.getElementById("dots"), foot = document.getElementById("foot");
slides.forEach((_, i) => {
  const b = document.createElement("button"); b.setAttribute("aria-label", `${i + 1}`);
  b.innerHTML = "<span></span>"; b.onclick = () => go(i); dots.appendChild(b);
});
let cur = -1, seek = null;
function go(i) {
  i = clamp(i, 0, slides.length - 1); if (i === cur) return;
  slides.forEach((s, j) => s.classList.toggle("on", j === i));
  [...dots.children].forEach((d, j) => d.toggleAttribute("aria-current", j === i));
  cur = i; const now = performance.now();
  canv.forEach((o) => { if (o.slide === i) o.start = now; });
  foot.textContent = `${S.ui.chapters[+slides[i].dataset.ch]}  ·  ${i + 1} / ${slides.length}`;
  history.replaceState(null, "", "#" + (i + 1));
  const other = document.getElementById("other");
  other.href = `${OTHER}?lang=${LANG}#${i + 1}`;
}
document.querySelectorAll(".replay").forEach((b) => b.onclick = () => {
  const o = canv.find((x) => x.slide === cur); if (o) o.start = performance.now();
});
let lock = 0;
addEventListener("wheel", (e) => {
  if (e.target.closest && e.target.closest("input")) return;
  const now = Date.now(); if (now < lock || Math.abs(e.deltaY) < 8) return;
  lock = now + 850; go(cur + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
  const k = e.key;
  if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(k)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowUp", "ArrowLeft", "PageUp"].includes(k)) { e.preventDefault(); go(cur - 1); }
  else if (k === "Home") go(0); else if (k === "End") go(slides.length - 1);
});
let tx = null;
addEventListener("touchstart", (e) => { tx = e.target.closest("input") ? null : [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
addEventListener("touchend", (e) => {
  if (!tx) return; const dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1];
  const d = Math.abs(dx) > Math.abs(dy) ? dx : dy; if (Math.abs(d) > 40) go(cur + (d < 0 ? 1 : -1)); tx = null;
}, { passive: true });

/* for screenshot checks: __seek(pageIndex, seconds) */
window.__seek = (i, t) => { go(i); seek = t; };

function frame(now) {
  for (const o of canv) {
    if (o.slide !== cur) continue;
    let t = (now - o.start) / 1000;
    if (o.dur) t = REDUCED ? o.dur : Math.min(t, o.dur);
    if (seek !== null) t = seek;
    paint(o, t);
  }
  requestAnimationFrame(frame);
}
sizeAll();
canv.forEach((o) => paint(o, o.dur || 0));
go(clamp((parseInt(location.hash.slice(1)) || 1) - 1, 0, slides.length - 1));
requestAnimationFrame(frame);
</script>
</body>
</html>
